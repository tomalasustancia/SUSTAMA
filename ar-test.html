<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SUSTAMA — AR Espacial Real (2D Sprite)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: transparent; font-family: monospace; }
        #overlay { position: fixed; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 30px; }
        .btn { pointer-events: auto; background: #b5f23d; color: black; border: none; font-weight: bold; padding: 16px 24px; border-radius: 8px; font-size: 16px; width: 100%; max-width: 280px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="overlay">
        <button id="xr-button" class="btn" disabled>Buscando WebXR...</button>
    </div>

<script>
    const xrButton = document.getElementById('xr-button');
    let xrSession = null;
    let gl = null;
    let shaderProgram = null;
    let vertexBuffer = null;
    let petTexture = null;

    // URL del Sprite de tu Tamagotchi (Usa una con fondo transparente PNG)
    const SPRITE_URL = "https://wikimedia.org";

    if (navigator.xr) {
        navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
            if (supported) {
                xrButton.disabled = false;
                xrButton.textContent = 'INICIAR AR';
            } else {
                xrButton.textContent = 'AR No Soportado';
            }
        });
    } else {
        xrButton.textContent = 'Navegador sin WebXR';
    }

    xrButton.onclick = () => {
        if (!xrSession) {
            navigator.xr.requestSession('immersive-ar').then(onSessionStarted);
        } else {
            xrSession.end();
        }
    };

    function onSessionStarted(session) {
        xrSession = session;
        xrButton.textContent = 'SALIR';

        const canvas = document.createElement('canvas');
        gl = canvas.getContext('webgl', { xrCompatible: true });

        // Inicializamos los Shaders y la Textura del Sprite
        initGLObjects();
        loadPetTexture(SPRITE_URL);

        xrSession.updateRenderState({ baseLayer: new XRWebGLLayer(xrSession, gl) });
        
        xrSession.requestReferenceSpace('local').then((refSpace) => {
            xrSession.requestAnimationFrame((time, frame) => onXRFrame(time, frame, refSpace));
        });

        xrSession.addEventListener('end', () => {
            xrSession = null;
            window.location.reload();
        });
    }

    function initGLObjects() {
        // Sombreador de vértices: Proyecta el plano en coordenadas tridimensionales reales
        const vsSource = `
            attribute vec3 position;
            attribute vec2 texCoord;
            varying vec2 vTexCoord;
            uniform mat4 uProjectionMatrix;
            uniform mat4 uViewMatrix;
            void main() {
                vTexCoord = texCoord;
                // Anclamos al Tamagotchi a medio metro de distancia al frente (Z = -0.5 metros)
                vec3 offsetPos = position + vec3(0.0, -0.1, -0.5);
                gl_Position = uProjectionMatrix * uViewMatrix * vec4(offsetPos, 1.0);
            }
        `;

        // Sombreador de fragmentos: Renderiza los píxeles de tu imagen respetando transparencias
        const fsSource = `
            precision mediump float;
            varying vec2 vTexCoord;
            uniform sampler2D uTexture;
            void main() {
                vec4 texColor = texture2D(uTexture, vTexCoord);
                if(texColor.a < 0.1) discard; // Descarta el fondo transparente del PNG
                gl_FragColor = texColor;
            }
        `;

        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, vsSource);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, fsSource);
        gl.compileShader(fs);

        shaderProgram = gl.createProgram();
        gl.attachShader(shaderProgram, vs);
        gl.attachShader(shaderProgram, fs);
        gl.linkProgram(shaderProgram);

        // Geometría de un plano 2D en espacio 3D (X, Y, Z, U, V)
        const vertices = new Float32Array([
            -0.15, -0.15,  0.0,   0.0, 1.0,
             0.15, -0.15,  0.0,   1.0, 1.0,
             0.15,  0.15,  0.0,   1.0, 0.0,
            -0.15, -0.15,  0.0,   0.0, 1.0,
             0.15,  0.15,  0.0,   1.0, 0.0,
            -0.15,  0.15,  0.0,   0.0, 0.0,
        ]);

        vertexBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
    }

    function loadPetTexture(url) {
        petTexture = gl.createTexture();
        const image = new Image();
        image.crossOrigin = "anonymous";
        image.src = url;
        image.onload = () => {
            gl.bindTexture(gl.TEXTURE_2D, petTexture);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            // Conservamos el pixelado nítido si tus sprites son Pixel Art
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        };
    }

    function onXRFrame(time, frame, refSpace) {
        let session = frame.session;
        session.requestAnimationFrame((t, f) => onXRFrame(t, f, refSpace));

        let pose = frame.getViewerPose(refSpace);
        if (pose) {
            let glLayer = session.renderState.baseLayer;
            gl.bindFramebuffer(gl.FRAMEBUFFER, glLayer.framebuffer);

            // Activamos mezcla de transparencias para que el sprite no tenga un recuadro blanco/negro
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

            gl.clearColor(0, 0, 0, 0);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

            gl.useProgram(shaderProgram);
            gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);

            const positionLoc = gl.getAttribLocation(shaderProgram, 'position');
            gl.enableVertexAttribArray(positionLoc);
            gl.vertexAttribPointer(positionLoc, 3, gl.FLOAT, false, 20, 0);

            const texCoordLoc = gl.getAttribLocation(shaderProgram, 'texCoord');
            gl.enableVertexAttribArray(texCoordLoc);
            gl.vertexAttribPointer(texCoordLoc, 2, gl.FLOAT, false, 20, 12);

            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, petTexture);
            gl.uniform1i(gl.getUniformLocation(shaderProgram, 'uTexture'), 0);

            for (let view of pose.views) {
                let viewport = glLayer.getViewport(view);
                gl.viewport(viewport.x, viewport.y, viewport.width, viewport.height);

                const pMatrixLoc = gl.getUniformLocation(shaderProgram, 'uProjectionMatrix');
                gl.uniformMatrix4fv(pMatrixLoc, false, view.projectionMatrix);

                const vMatrixLoc = gl.getUniformLocation(shaderProgram, 'uViewMatrix');
                gl.uniformMatrix4fv(vMatrixLoc, false, view.transform.inverse.matrix);

                gl.drawArrays(gl.TRIANGLES, 0, 6);
            }
        }
    }
</script>
</body>
</html>
