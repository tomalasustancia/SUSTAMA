<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebXR Pure Isolation Test</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: monospace; overflow: hidden; }
        #ui { position: fixed; z-index: 100; padding: 20px; text-align: center; width: 100%; box-sizing: border-box; }
        button { padding: 15px 25px; font-size: 16px; font-weight: bold; background: #b5f23d; color: #000; border: none; border-radius: 8px; cursor: pointer; }
        button:disabled { background: #555; color: #aaa; }
        #console { text-align: left; background: rgba(0,0,0,0.8); padding: 10px; margin-top: 15px; border-radius: 5px; max-height: 200px; overflow-y: auto; font-size: 12px; }
        /* Video de respaldo por si el passthrough falla */
        #fallback-video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; pointer-events: none; }
        canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
    </style>
</head>
<body>

    <div id="ui">
        <h2>Aislamiento WebXR Nativo</h2>
        <button id="start-btn" disabled>Comprobando...</button>
        <div id="console"></div>
    </div>

    <video id="fallback-video" autoplay playsinline muted hidden></video>
    <canvas id="webgl-canvas"></canvas>

<script>
    const logEl = document.getElementById('console');
    const startBtn = document.getElementById('start-btn');
    const canvas = document.getElementById('webgl-canvas');
    const video = document.getElementById('fallback-video');
    
    function log(msg, isError = false) {
        const div = document.createElement('div');
        div.style.color = isError ? '#ff5a3c' : '#7ccf3a';
        div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
        console.log(msg);
    }

    // 1. Verificar soporte WebXR
    if (!navigator.xr) {
        log('WebXR no está disponible en este navegador.', true);
        startBtn.textContent = 'Sin soporte WebXR';
    } else {
        navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
            if (supported) {
                log('Soporte nativo "immersive-ar" DETECTADO.');
                startBtn.disabled = false;
                startBtn.textContent = 'Iniciar AR Puro';
            } else {
                log('El navegador tiene WebXR pero no soporta RA de inmersión.', true);
                startBtn.textContent = 'RA no soportada';
            }
        }).catch(err => log('Error al validar soporte: ' + err.message, true));
    }

    startBtn.onclick = async () => {
        startBtn.disabled = true;
        log('Solicitando cámara tradicional de respaldo primero (forzar permisos)...');
        
        // Forzamos el acceso a la cámara vía web estándar para descartar bloqueos de hardware
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            video.srcObject = stream;
            video.hidden = false;
            log('Cámara del sistema abierta con éxito en el fondo.', false);
        } catch (e) {
            log('No se pudo abrir la cámara de forma tradicional: ' + e.message, true);
        }

        log('Abriendo sesión WebXR...');
        try {
            // Solicitamos una sesión limpia sin features complejas
            const session = await navigator.xr.requestSession('immersive-ar', {
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: document.getElementById('ui') }
            });
            
            log('¡Sesión WebXR iniciada correctamente!', false);
            
            // Inicializar WebGL Puro (sin librerías)
            const gl = canvas.getContext('webgl', { xrCompatible: true });
            if (!gl) {
                log('No se pudo crear el contexto WebGL compatible con XR.', true);
                return;
            }

            const xrLayer = new XRWebGLLayer(session, gl);
            session.updateRenderState({ baseLayer: xrLayer });
            
            const refSpace = await session.requestReferenceSpace('local');
            
            // Bucle de renderizado nativo
            const onXRFrame = (time, frame) => {
                session.requestAnimationFrame(onXRFrame);
                
                const pose = frame.getViewerPose(refSpace);
                if (pose) {
                    gl.bindFramebuffer(gl.FRAMEBUFFER, xrLayer.framebuffer);
                    
                    // Limpiamos la pantalla asegurando transperencia total para ver la cámara
                    gl.clearColor(0.0, 0.0, 0.0, 0.0); 
                    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
                    
                    // IMPORTANTE: Si la pantalla sigue negra aquí, el fallo es de ARCore (Android) 
                    // comunicando los frames de la cámara hacia la capa WebGL de Chrome.
                }
            };
            
            session.requestAnimationFrame(onXRFrame);
            session.addEventListener('end', () => log('Sesión AR finalizada.'));

        } catch (err) {
            log('Fallo crítico al iniciar sesión XR: ' + err.message, true);
            startBtn.disabled = false;
        }
    };
</script>
</body>
</html>
