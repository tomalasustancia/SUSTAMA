<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR SUSTAMA — Solución Definitiva</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: transparent; font-family: monospace; }
        #ar-overlay { position: fixed; inset: 0; z-index: 10; pointer-events: none; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
        .ui-box { pointer-events: auto; background: rgba(0,0,0,0.8); color: #b5f23d; padding: 15px; border-radius: 10px; text-align: center; width: 80%; max-width: 300px; margin-bottom: 20px; border: 1px solid #b5f23d; }
        button { background: #b5f23d; color: black; border: none; font-weight: bold; padding: 14px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; font-family: inherit; }
        button:disabled { background: #333; color: #777; border: 1px solid #555; }
    </style>
    <!-- Cargamos Three.js moderno -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="ar-overlay">
        <div class="ui-box">
            <h3 style="margin: 0 0 10px 0; color: white;">SUSTAMA AR</h3>
            <button id="ar-button" disabled>Comprobando XR...</button>
        </div>
    </div>

<script>
    const button = document.getElementById('ar-button');
    let scene, camera, renderer, cube;

    // 1. Comprobación estricta de soporte (Igual al sample oficial)
    if (navigator.xr) {
        navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
            if (supported) {
                button.disabled = false;
                button.textContent = "ENTRAR A RA";
            } else {
                button.textContent = "RA No Soportada";
            }
        });
    } else {
        button.textContent = "Sin WebXR en navegador";
    }

    // 2. Inicialización limpia de la Escena
    function setupScene() {
        scene = new THREE.Scene();
        
        // El FOV se auto-ajustará con la cámara física del celular al iniciar XR
        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

        // CONFIGURACIÓN CLAVE: Inicializamos el renderer de la forma más plana y limpia posible
        // Dejamos que WebXR tome el control total del canal Alpha y los buffers internos
        renderer = new THREE.WebGLRenderer({ antialias: false }); 
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Agregamos un cubo flotando a 50cm enfrente (Z = -0.5) para validar la escena
        const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
        const material = new THREE.MeshBasicMaterial({ color: 0xff5a3c });
        cube = new THREE.Mesh(geometry, material);
        cube.position.set(0, 0, -0.5); 
        scene.add(cube);
    }

    // 3. Activación de la sesión AR
    async function startAR() {
        setupScene();

        try {
            // Solicitamos la sesión exactamente con los parámetros del sample que te funcionó
            const session = await navigator.xr.requestSession('immersive-ar', {
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: document.getElementById('ar-overlay') }
            });

            await renderer.xr.setSession(session);
            
            // Cambiamos el comportamiento del botón para que sirva para salir
            button.textContent = "SALIR DE AR";
            button.onclick = () => session.end();

            // Ciclo de renderizado nativo gestionado por Three.js XR
            renderer.setAnimationLoop(() => {
                if (cube) {
                    cube.rotation.y += 0.02; // Animación para verificar que el render corre fluido
                }
                renderer.render(scene, camera);
            });

            session.addEventListener('end', () => {
                renderer.setAnimationLoop(null);
                window.location.reload(); // Limpieza absoluta de contextos WebGL colgados
            });

        } catch (err) {
            alert("Error al iniciar sesión AR: " + err.message);
        }
    }

    button.onclick = startAR;
</script>
</body>
</html>
